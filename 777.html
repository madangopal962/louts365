<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Lotus 365/777 Jackpot</title>
  <style>
    :root {
      --bg-1: #081016;
      --bg-2: #1c0f2e;
      --panel: rgba(8, 18, 29, 0.78);
      --panel-border: rgba(255, 255, 255, 0.15);
      --gold: #f9c74f;
      --mint: #80ffdb;
      --danger: #ff6b6b;
      --text: #f3f8ff;
      --muted: #aac2d8;
      --chip: #2a9d8f;
      --chip-dark: #1b6f66;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: "Trebuchet MS", "Lucida Sans Unicode", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 175, 80, 0.18), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(128, 255, 219, 0.15), transparent 34%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    .glow-shape {
      position: fixed;
      inset: auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .glow-a {
      top: -100px;
      left: -80px;
      background: #ff8fab;
    }

    .glow-b {
      bottom: -120px;
      right: -60px;
      background: #80ffdb;
      animation-delay: 1.7s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }

    .casino {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      padding: 22px;
      animation: reveal 0.7s ease;
    }

    .casino.win {
      animation: winPulse 0.6s ease;
    }

    .casino.loss {
      animation: lossShake 0.4s ease;
    }

    .casino.jackpot {
      animation: jackpotBlast 1.1s ease;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes winPulse {
      0% { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); transform: scale(1); }
      50% { box-shadow: 0 18px 48px rgba(128, 255, 219, 0.6); transform: scale(1.01); }
      100% { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); transform: scale(1); }
    }

    @keyframes lossShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    @keyframes jackpotBlast {
      0% { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); transform: scale(1); }
      25% { box-shadow: 0 0 60px rgba(249, 199, 79, 0.75); transform: scale(1.02); }
      50% { box-shadow: 0 0 100px rgba(249, 199, 79, 0.9); transform: scale(1.03); }
      100% { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); transform: scale(1); }
    }

    .title {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-family: "Georgia", "Times New Roman", serif;
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(249, 199, 79, 0.5);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .value {
      margin-top: 6px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .reel {
      height: 120px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(180deg, #152331, #0b111a);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      position: relative;
      overflow: hidden;
    }

    .symbol-image {
      width: min(72px, 72%);
      height: min(72px, 72%);
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
      user-select: none;
      pointer-events: none;
    }

    .reel.spinning {
      filter: brightness(1.12);
    }

    .roll-strip {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .roll-cell {
      width: 100%;
      height: 120px;
      display: grid;
      place-items: center;
    }

    .reel.win {
      animation: winReel 0.45s ease;
    }

    .reel.loss {
      animation: lossReel 0.4s ease;
    }

    .reel.jackpot {
      animation: jackpotReel 1.1s ease;
      border-color: rgba(249, 199, 79, 0.9);
      box-shadow: 0 0 24px rgba(249, 199, 79, 0.8);
    }

    @keyframes spinFlash {
      0% { transform: translateY(0); filter: brightness(1); }
      30% { transform: translateY(-3px); filter: brightness(1.2); }
      100% { transform: translateY(0); filter: brightness(1); }
    }

    @keyframes winReel {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes lossReel {
      0% { filter: saturate(1); }
      50% { filter: saturate(0.6); }
      100% { filter: saturate(1); }
    }

    @keyframes jackpotReel {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.08) rotate(-1deg); }
      60% { transform: scale(1.1) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    input[type="number"] {
      width: 130px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #042025;
      background: linear-gradient(180deg, var(--mint), #57cc99);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 16px rgba(87, 204, 153, 0.35);
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: linear-gradient(180deg, var(--chip), var(--chip-dark));
      color: #ebfffb;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .message {
      min-height: 28px;
      text-align: center;
      font-weight: 700;
      color: var(--gold);
    }

    .message.loss {
      color: var(--danger);
    }

    .legend {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
    }

    .jackpot-badge {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      vertical-align: middle;
      margin-left: 6px;
    }

    .jackpot-symbol {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    }

    @media (max-width: 640px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .reel {
        height: 100px;
      }

      .roll-cell {
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="glow-shape glow-a"></div>
  <div class="glow-shape glow-b"></div>

  <main class="casino">
    <h1 class="title">Lotus 365</h1>

    <section class="stats">
      <div class="card">
        <div class="label">Balance</div>
        <div class="value" id="balance">$1000</div>
      </div>
      <div class="card">
        <div class="label">Current Bet</div>
        <div class="value" id="currentBet">$50</div>
      </div>
      <div class="card">
        <div class="label">Last Win</div>
        <div class="value" id="lastWin">$0</div>
      </div>
    </section>

    <section class="reels" aria-label="Slot reels">
      <div class="reel" id="reel1">?</div>
      <div class="reel" id="reel2">?</div>
      <div class="reel" id="reel3">?</div>
    </section>

    <section class="controls">
      <input id="betInput" type="number" min="10" step="10" value="50" />
      <button id="setBetBtn">Set Bet</button>
      <button id="spinBtn">Spin</button>
      <button id="resetBtn">Reset</button>
    </section>

    <section class="chip-row" aria-label="Quick bet chips">
      <button class="chip" data-chip="10">$10</button>
      <button class="chip" data-chip="25">$25</button>
      <button class="chip" data-chip="50">$50</button>
      <button class="chip" data-chip="100">$100</button>
      <button class="chip" data-chip="200">$200</button>
    </section>

    <p id="message" class="message">Set your bet and spin.</p>

    <p class="legend">
      Jackpot only on
      <span class="jackpot-badge" aria-label="SEVEN SEVEN SEVEN jackpot">
        <img class="jackpot-symbol" id="legendSeven1" alt="SEVEN" />
        <img class="jackpot-symbol" id="legendSeven2" alt="SEVEN" />
        <img class="jackpot-symbol" id="legendSeven3" alt="SEVEN" />
      </span>
    </p>
  </main>

  <script>
    const symbols = ["CHERRY", "LEMON", "BELL", "STAR", "SEVEN"];
    const startingBalance = 1000;
    const minBet = 10;
    const houseEdge = 0.15;
    const rtp = 1 - houseEdge;

    let balance = startingBalance;
    let bet = 50;

    const balanceEl = document.getElementById("balance");
    const betEl = document.getElementById("currentBet");
    const winEl = document.getElementById("lastWin");
    const betInput = document.getElementById("betInput");
    const setBetBtn = document.getElementById("setBetBtn");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageEl = document.getElementById("message");
    const casinoEl = document.querySelector(".casino");
    const reels = [
      document.getElementById("reel1"),
      document.getElementById("reel2"),
      document.getElementById("reel3")
    ];
    const symbolUriCache = {};

    function toMoney(value) {
      return `$${value}`;
    }

    function pickSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function symbolSvg(symbol) {
      const icon = {
        CHERRY: `
          <path d='M36 30 C44 16,56 16,64 30' stroke='#43aa8b' stroke-width='4' fill='none' stroke-linecap='round'/>
          <circle cx='37' cy='58' r='16' fill='#e63946' stroke='#8d1b24' stroke-width='2'/>
          <circle cx='63' cy='58' r='16' fill='#ef233c' stroke='#8d1b24' stroke-width='2'/>
          <ellipse cx='31' cy='52' rx='5' ry='3' fill='rgba(255,255,255,0.45)'/>
          <ellipse cx='57' cy='52' rx='5' ry='3' fill='rgba(255,255,255,0.35)'/>
        `,
        LEMON: `
          <ellipse cx='50' cy='56' rx='24' ry='16' fill='#f4d35e' stroke='#c69f2a' stroke-width='2'/>
          <path d='M28 56 Q50 40 72 56 Q50 72 28 56Z' fill='rgba(255,255,255,0.2)'/>
          <path d='M50 38 L50 74' stroke='#e8c14f' stroke-width='2'/>
          <path d='M36 47 L64 65' stroke='#e8c14f' stroke-width='2'/>
          <path d='M36 65 L64 47' stroke='#e8c14f' stroke-width='2'/>
        `,
        BELL: `
          <path d='M32 66 H68 V70 H32 Z' fill='#cf9f2d'/>
          <path d='M50 30 C62 30,72 41,72 54 V66 H28 V54 C28 41,38 30,50 30Z' fill='#ffd166' stroke='#be8d1f' stroke-width='2'/>
          <circle cx='50' cy='66' r='4' fill='#8b5a00'/>
          <rect x='46' y='24' width='8' height='6' rx='3' fill='#ffd166'/>
        `,
        STAR: `
          <polygon points='50,26 57,44 76,44 61,56 67,74 50,63 33,74 39,56 24,44 43,44' fill='#4cc9f0' stroke='#2186a8' stroke-width='2'/>
          <circle cx='50' cy='50' r='4' fill='rgba(255,255,255,0.6)'/>
        `,
        SEVEN: `
          <text x='50' y='67' text-anchor='middle' font-family='Trebuchet MS,Segoe UI,sans-serif' font-size='46' font-weight='800' fill='#ffffff' stroke='#b5179e' stroke-width='1.5'>7</text>
          <path d='M30 34 H70' stroke='#f15bb5' stroke-width='3' stroke-linecap='round'/>
        `,
        PLACEHOLDER: `
          <circle cx='50' cy='50' r='18' fill='none' stroke='#8ea6be' stroke-width='2.5' stroke-dasharray='4 4'/>
          <text x='50' y='60' text-anchor='middle' font-family='Trebuchet MS,Segoe UI,sans-serif' font-size='28' font-weight='700' fill='#8ea6be'>?</text>
        `
      }[symbol] || `
        <circle cx='50' cy='50' r='18' fill='none' stroke='#8ea6be' stroke-width='2.5' stroke-dasharray='4 4'/>
      `;

      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' role='img' aria-label='${symbol}'>
        <defs>
          <linearGradient id='tileBg' x1='0' y1='0' x2='0' y2='1'>
            <stop offset='0%' stop-color='#223245'/>
            <stop offset='100%' stop-color='#111a27'/>
          </linearGradient>
        </defs>
        <rect x='8' y='8' rx='16' ry='16' width='84' height='84' fill='url(#tileBg)' stroke='rgba(255,255,255,0.35)' stroke-width='2'/>
        ${icon}
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function symbolSrc(symbol) {
      if (!symbolUriCache[symbol]) {
        symbolUriCache[symbol] = symbolSvg(symbol);
      }
      return symbolUriCache[symbol];
    }

    function renderSymbol(reel, symbol) {
      const img = document.createElement("img");
      img.className = "symbol-image";
      img.alt = symbol;
      img.src = symbolSrc(symbol);
      reel.replaceChildren(img);
    }

    function createRollStrip(totalRandom, finalSymbol, settleCopies = 4) {
      const strip = document.createElement("div");
      strip.className = "roll-strip";

      for (let i = 0; i < totalRandom; i += 1) {
        const cell = document.createElement("div");
        cell.className = "roll-cell";
        const img = document.createElement("img");
        img.className = "symbol-image";
        img.alt = "rolling symbol";
        img.src = symbolSrc(pickSymbol());
        cell.appendChild(img);
        strip.appendChild(cell);
      }

      for (let i = 0; i < settleCopies; i += 1) {
        const finalCell = document.createElement("div");
        finalCell.className = "roll-cell";
        const finalImg = document.createElement("img");
        finalImg.className = "symbol-image";
        finalImg.alt = finalSymbol;
        finalImg.src = symbolSrc(finalSymbol);
        finalCell.appendChild(finalImg);
        strip.appendChild(finalCell);
      }

      return strip;
    }

    function renderLegendJackpot() {
      const sevenIcon = symbolSrc("SEVEN");
      ["legendSeven1", "legendSeven2", "legendSeven3"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.src = sevenIcon;
      });
    }

    function setMessage(text, isLoss = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle("loss", isLoss);
    }

    function refreshUI(lastWin = 0) {
      balanceEl.textContent = toMoney(balance);
      betEl.textContent = toMoney(bet);
      winEl.textContent = toMoney(lastWin);
      spinBtn.disabled = balance < bet || balance < minBet;

      if (balance < minBet) {
        setMessage("Balance too low to place a new bet. Press Reset.", true);
      }
    }

    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function removeFrom(list, value) {
      return list.filter((item) => item !== value);
    }

    // Weighted outcomes tuned for 85% RTP.
    // 1% jackpot (25x), 30% pair (1.5x), 20% single-seven bonus (0.75x), 49% loss (0x).
    function buildOutcome() {
      const roll = Math.random();
      const nonSeven = symbols.filter((s) => s !== "SEVEN");

      if (roll < 0.01) {
        return {
          result: ["SEVEN", "SEVEN", "SEVEN"],
          win: Math.floor(bet * 25),
          label: "JACKPOT! Triple SEVEN!",
          type: "jackpot"
        };
      }

      if (roll < 0.31) {
        const pairSymbol = randomFrom(nonSeven);
        const oddSymbol = randomFrom(removeFrom(nonSeven, pairSymbol));
        const patterns = [
          [pairSymbol, pairSymbol, oddSymbol],
          [pairSymbol, oddSymbol, pairSymbol],
          [oddSymbol, pairSymbol, pairSymbol]
        ];

        return {
          result: randomFrom(patterns),
          win: Math.floor(bet * 1.5),
          label: "Pair win.",
          type: "win"
        };
      }

      if (roll < 0.51) {
        const otherA = randomFrom(nonSeven);
        const otherB = randomFrom(removeFrom(nonSeven, otherA));
        const patterns = [
          ["SEVEN", otherA, otherB],
          [otherA, "SEVEN", otherB],
          [otherA, otherB, "SEVEN"]
        ];

        return {
          result: randomFrom(patterns),
          win: Math.floor(bet * 0.75),
          label: "Seven bonus.",
          type: "win"
        };
      }

      const shuffled = [...nonSeven].sort(() => Math.random() - 0.5);
      return {
        result: [shuffled[0], shuffled[1], shuffled[2]],
        win: 0,
        label: "No win this spin.",
        type: "loss"
      };
    }

    function animateReels(finalSymbols) {
      const spinPromises = reels.map((reel, index) => {
        return new Promise((resolve) => {
          const reelHeight = reel.clientHeight;
          const randomCount = 28 + index * 6;
          const settleCopies = 5;
          const strip = createRollStrip(randomCount, finalSymbols[index], settleCopies);
          const settleCells = 5;
          const phase1Cells = randomCount - settleCells;
          const phase1Travel = phase1Cells * reelHeight;
          const phase2Travel = (randomCount + settleCopies - 1) * reelHeight;
          const phase1Duration = 900 + index * 140;
          const phase2Duration = 820 + index * 180;

          reel.classList.add("spinning");
          reel.replaceChildren(strip);
          strip.style.filter = "blur(0.6px)";

          strip.style.transform = "translate3d(0, 0, 0)";
          strip.getBoundingClientRect();
          strip.style.transition = `transform ${phase1Duration}ms linear`;
          strip.style.transform = `translate3d(0, -${phase1Travel}px, 0)`;

          strip.addEventListener("transitionend", () => {
            strip.style.transition = `transform ${phase2Duration}ms cubic-bezier(0.14, 0.82, 0.18, 1)`;
            strip.style.transform = `translate3d(0, -${phase2Travel}px, 0)`;

            strip.addEventListener("transitionend", () => {
              renderSymbol(reel, finalSymbols[index]);
              reel.classList.remove("spinning");
              resolve();
            }, { once: true });
          }, { once: true });
        });
      });

      return Promise.all(spinPromises);
    }

    function animateOutcome(type) {
      casinoEl.classList.remove("win", "loss", "jackpot");
      reels.forEach((reel) => reel.classList.remove("win", "loss", "jackpot"));

      void casinoEl.offsetWidth;

      casinoEl.classList.add(type);
      reels.forEach((reel) => reel.classList.add(type));

      const duration = type === "jackpot" ? 1100 : 500;
      setTimeout(() => {
        casinoEl.classList.remove("win", "loss", "jackpot");
        reels.forEach((reel) => reel.classList.remove("win", "loss", "jackpot"));
      }, duration);
    }

    async function spin() {
      if (balance < bet) {
        setMessage("Insufficient balance for this bet. Lower your bet or reset.", true);
        refreshUI();
        return;
      }

      balance -= bet;
      spinBtn.disabled = true;
      setMessage("Spinning...");

      const outcome = buildOutcome();
      await animateReels(outcome.result);
      balance += outcome.win;
      animateOutcome(outcome.type);

      const net = outcome.win - bet;
      if (outcome.win > 0) {
        setMessage(`${outcome.label} Win ${toMoney(outcome.win)} (Net ${toMoney(net)}).`);
      } else {
        setMessage(`${outcome.label} Lost ${toMoney(bet)}.`, true);
      }

      refreshUI(outcome.win);
    }

    function setBet() {
      const nextBet = Number(betInput.value);

      if (!Number.isInteger(nextBet) || nextBet < minBet) {
        setMessage(`Bet must be an integer of at least ${toMoney(minBet)}.`, true);
        return;
      }

      if (nextBet > balance) {
        setMessage("Bet cannot be higher than your available balance.", true);
        return;
      }

      bet = nextBet;
      setMessage(`Bet set to ${toMoney(bet)}.`);
      refreshUI();
    }

    function resetGame() {
      balance = startingBalance;
      bet = 50;
      betInput.value = bet;
      reels.forEach((reel) => {
        renderSymbol(reel, "PLACEHOLDER");
      });
      setMessage(`Game reset. RTP ${Math.round(rtp * 100)}%, house edge ${Math.round(houseEdge * 100)}%.`);
      refreshUI();
    }

    setBetBtn.addEventListener("click", setBet);
    spinBtn.addEventListener("click", spin);
    resetBtn.addEventListener("click", resetGame);

    document.querySelectorAll(".chip").forEach((chipBtn) => {
      chipBtn.addEventListener("click", () => {
        betInput.value = chipBtn.dataset.chip;
        setBet();
      });
    });

    renderLegendJackpot();
    resetGame();
  </script>
